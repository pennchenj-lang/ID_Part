# These are checksum-bound executed scientific records. Keep their bytes intact.
# Maintained replay/recompute tools in the neighboring review-options directory
# receive the normal repository checks. This local configuration exempts only
# the specific non-semantic archive findings below; undefined-name, syntax and
# other runtime-relevant checks (including F821) remain enabled.
